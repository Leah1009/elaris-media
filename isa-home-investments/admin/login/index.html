<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Isa Home Investments</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card" id="loginCard" style="visibility:hidden;">
    <img src="/assets/logo.jpg" alt="Isa Home Investments">
    <span class="eyebrow">Isa Home Investments</span>
    <h1>Admin Login</h1>
    <form id="loginForm">
      <div class="login-field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary login-submit" id="loginBtn">Log In</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/supabase-client.js"></script>
<script>
const loginCard = document.getElementById('loginCard');
const loginForm = document.getElementById('loginForm');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');

function showError(msg){
  loginError.textContent = msg;
  loginError.classList.add('show');
}

(async function init(){
  if(!supabaseClient){
    loginCard.style.visibility = 'visible';
    showError('Could not load required scripts. Please check your connection and refresh the page.');
    loginBtn.setAttribute('disabled', 'disabled');
    return;
  }
  // Already signed in as the admin? Skip straight to the dashboard instead
  // of flashing a login form.
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session && session.user && session.user.email === ADMIN_EMAIL){
    window.location.replace('/admin');
    return;
  }
  loginCard.style.visibility = 'visible';
})();

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if(!supabaseClient){
    showError('Could not connect. Please refresh the page and try again.');
    return;
  }
  loginError.classList.remove('show');
  loginBtn.setAttribute('disabled', 'disabled');
  loginBtn.textContent = 'Logging In…';

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  try{
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error) throw error;

    if(!data.user || data.user.email !== ADMIN_EMAIL){
      await supabaseClient.auth.signOut();
      throw new Error('This account is not authorized to access the admin panel.');
    }

    window.location.href = '/admin';
  }catch(err){
    console.error('ADMIN LOGIN ERROR', err);
    showError(err.message || 'Login failed. Please check your credentials and try again.');
    loginBtn.removeAttribute('disabled');
    loginBtn.textContent = 'Log In';
  }
});
</script>
</body>
</html>
